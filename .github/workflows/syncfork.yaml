# Scheduled sync of `lsst-sqre/phalanx:main` with
# `wfau/phalanx:main`.

name: Sync Fork Main

on:
  schedule:
    - cron: "42 8 * * *"

  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch to compare from
        required: true
        type: string
        default: fork-mgmt
      target_branch:
        description: Branch to compare against
        required: true
        type: string
        default: main

permissions:
  contents: write

env:
  BASE_BRANCH: ${{ inputs.base_branch || 'fork-mgmt'}}
  TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync fork main with upstream main
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            --field branch=${TARGET_BRANCH}
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    runs-on: ubuntu-latest
    needs: sync-main
    if: always()
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Fetch synced main
        run: |
          git fetch --no-tags origin \
            +refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH} \
            +refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install report dependencies
        run: python -m pip install GitPython pyyaml tabulate

      - name: Generate report
        run: |
          python fork-mgmt/scripts/change-report.py \
          --base "origin/${BASE_BRANCH}" \
          --target "origin/${TARGET_BRANCH}" \
          >> "$GITHUB_STEP_SUMMARY"

            
        