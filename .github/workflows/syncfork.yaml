# Scheduled sync of `lsst-sqre/phalanx:main` with
# `wfau/phalanx:main`.

name: Sync Fork Main

"on":
  schedule:
    - cron: "42 8 * * *"
      timezone: "Europe/London"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync fork main with upstream main
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            --field branch=main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Describe sync
        if: always()
        run: |
            echo "## Fork sync" >> "$GITHUB_STEP_SUMMARY"
            echo "Synchronising upstream/main with fork/main." \
                >> "$GITHUB_STEP_SUMMARY"


            
        