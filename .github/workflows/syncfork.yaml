# Scheduled sync of `lsst-sqre/phalanx:main` with
# `wfau/phalanx:main`.

name: Sync Fork Main

on:
  schedule:
    - cron: "42 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork-main
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync fork main with upstream main
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            --field branch=main
        env:
          GH_TOKEN: ${{ github.token }}

  report:
    runs-on: ubuntu-latest
    needs: sync-main
    if: always()
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Fetch synced main
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/fork-mgmt:refs/remotes/origin/fork-mgmt
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install report dependencies
        run: python -m pip install GitPython pyyaml tabulate

      - name: Generate report
        run: |
          python fork-mgmt/scripts/change-report.py >> "$GITHUB_STEP_SUMMARY"

            
        